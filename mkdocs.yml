site_name: Weaver documentation
site_description: Build and operate Microsoft Fabric estates with Weaver — Lakehouses, Warehouses, semantic models and Reports in one project
site_url: https://docs.weaverstack.dev
repo_name: GitHub
repo_url: https://github.com/weaverstack/weaverstack
edit_uri: https://github.com/weaverstack/weaverstack-docs/edit/main/docs/
strict: true

exclude_docs: |
  _maintainers/

theme:
  name: material
  custom_dir: overrides
  language: en
  favicon: assets/images/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest

plugins:
  - search:
      lang: en

hooks:
  - tools/notebook_presentation.py
  - tools/terminal_presentation.py

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/dashboard-demo.js

